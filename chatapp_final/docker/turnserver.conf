# coturn yapılandırması
# YOUR_SERVER_IP yerine sunucu IP'nizi yazın

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Dış IP (VPS/sunucu IP'niz)
# external-ip=YOUR_SERVER_IP

# Kimlik doğrulama
lt-cred-mech
user=nexususer:nexus_turn_pass_degistirin

realm=nexus.local
server-name=nexus

# Loglama
log-file=/var/log/coturn/turn.log
simple-log

# DTLS/TLS (isteğe bağlı, sertifika gerekir)
# cert=/etc/coturn/certs/cert.pem
# pkey=/etc/coturn/certs/key.pem

# Güvenlik
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
